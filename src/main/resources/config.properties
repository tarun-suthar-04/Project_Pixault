# ============================================================
# Pixault - Safe Default Configuration
# ============================================================
#
# Do not put real passwords, app passwords, ngrok URLs, or long-term secrets in
# this committed file. For local development, copy config.local.properties.example
# to config.local.properties in the project root and fill in private values.
#
# Environment variables override these values. Example:
# PIXAULT_DB_PASSWORD, PIXAULT_MAIL_PASSWORD, PIXAULT_TOKEN_HMAC_SECRET.

# --- Database ---
db.host=localhost
db.port=3306
db.name=pixault_db
db.username=
db.password=
db.useSSL=false
db.allowPublicKeyRetrieval=true

# --- SMTP ---
mail.host=smtp.gmail.com
mail.port=465
mail.username=
mail.password=
mail.from=Pixault Vault <noreply@example.com>
mail.auth=true
mail.starttls=false
mail.ssl=true
mail.connectiontimeout.ms=10000
mail.timeout.ms=10000
mail.writetimeout.ms=10000
mail.debug=false

# --- Token Secrets ---
# Replace in config.local.properties or environment variables before real use.
token.hmac.secret=CHANGE_ME_USE_A_LONG_RANDOM_SECRET

# --- Session ---
session.ttl.hours=2

# --- OTP ---
otp.email.expiry.minutes=5
otp.totp.window=1

# --- Account Lockout ---
lockout.max.attempts=5
lockout.duration.minutes=15

# --- Share Links ---
app.base.url=http://localhost:8088
share.public.url=http://localhost:8088
share.bind.host=0.0.0.0
